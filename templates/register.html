<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Main CSS-->
    <link rel="stylesheet" type="text/css" href="/static/css/main.css">
    <!-- Font-icon css-->
    <link rel="stylesheet" type="text/css" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Login</title>
  </head>
  <body>
    <section class="material-half-bg">
      <div class="cover"></div>
    </section>
    <section class="login-content">
      <div class="logo">
        <h1>House Price prediction</h1>
      </div>
      <div class="login-box">
<form id="form1" name="form1" method="post" action="">
  <br>
  <br>
    <table class="table table-borderless">

      <tr>
        <td width="63"><div align="center">Name</div></td>
        <td width="153"><label>
          <input type="text" name="textfield" id="textfield" class="form-control" required/>
        </label></td>
      </tr>
      <tr>
        <td><div align="center">Email</div></td>
        <td><label>
          <input type="email" name="textfield2" id="textfield2" class="form-control" required/>
        </label></td>
      </tr>
      <tr>
        <td><div align="center">Phone</div></td>
        <td><label>
          <input type="text" name="textfield3" id="textfield3" class="form-control" required pattern="[6-9][0-9]{9}"/>
        </label></td>
      </tr>
   <tr>
        <td><div align="center">Password</div></td>
        <td><label>
          <input type="password" name="p" id="textfield3" class="form-control" required/>
        </label></td>
      </tr>
      <tr>
        <td colspan="2"><div align="center">
          <input type="submit" name="button" id="button" value="Register"  class="btn btn-primary btn-block" />
        </div></td>
      </tr>
    </table>
    <div align="left"></div>
  
</form>

      </div>
    </section>
    <!-- Essential javascripts for application to work-->
    <script src="/static/js/jquery-3.3.1.min.js"></script>
    <script src="/static/js/popper.min.js"></script>
    <script src="/static/js/bootstrap.min.js"></script>
    <script src="/static/js/main.js"></script>
    <!-- The javascript plugin to display page loading on top-->
    <script src="/static/js/plugins/pace.min.js"></script>
    <script type="text/javascript">
      // Login Page Flipbox control
      $('.login-content [data-toggle="flip"]').click(function() {
      	$('.login-box').toggleClass('flipped');
      	return false;
      });
    </script>
  </body>
</html>
